<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LYNCO 카드 목록</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f6f7;color:#202323;font:15px/1.6 'Malgun Gothic',sans-serif;letter-spacing:0}header{padding:26px 4vw 18px;border-bottom:1px solid #cfd3d4;background:white}h1{font-size:28px;margin:0}header p{margin:6px 0 0;color:#626969}main{max-width:1440px;margin:auto;padding:24px}.toolbar{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:20px}input,select,button{font:inherit;background:white;border:1px solid #bfc6c7;border-radius:4px;padding:9px 12px}input{flex:1;min-width:190px}button{cursor:pointer}button:hover{background:#ffe976}.layout{display:grid;grid-template-columns:minmax(360px,1.35fr) minmax(300px,1fr);gap:32px}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;background:white;white-space:nowrap}th,td{text-align:left;padding:12px;border-bottom:1px solid #e0e3e4}th{font-size:12px;color:#667071}tr[data-id]{cursor:pointer}tr[data-id]:hover{background:#f5f6f0}tr.selected{background:#fff5bf}td button{border:0;padding:0;background:transparent;text-align:left}.swatch{display:inline-block;width:13px;height:13px;border:1px solid #999;margin-right:8px}.white{background:white}.black{background:#202323}.detail{min-width:0;position:sticky;top:20px;align-self:start}h2{font-size:25px;margin:10px 0 4px}.meta,.legend{color:#636b6c;font-size:13px}.icon{width:88px;height:88px;object-fit:contain;background:#fff;border:1px solid #d5d8d9;padding:8px;border-radius:6px}.icon.dark{background:#242727}dl{display:grid;grid-template-columns:90px 1fr;gap:8px;margin:20px 0}dt{color:#697172}dd{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}.status{font-size:12px;padding:3px 6px;background:#edf1f0;color:#455654}.pending{background:#fff0cc;color:#745520}.grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:5px;max-width:350px;margin:14px 0}.cell{height:42px;padding:0;border:1px dashed #a8b0b1;background:#eef0f1}.cell.source{background:#ffe165;border-style:solid}.cell.target{background:#f9d8ef;border:2px solid #c44798}.description{white-space:pre-wrap;font-size:17px;margin:20px 0}.empty{padding:30px;color:#697172}details{margin-top:22px;color:#697172;font-size:13px}footer{margin-top:30px;border-top:1px solid #d5dada;padding-top:16px;color:#667172;font-size:13px}@media(max-width:820px){.layout{grid-template-columns:1fr}.detail{position:static}main{padding:16px}header{padding:20px 16px}}@media print{.toolbar{display:none}.layout{display:block}.detail{position:static}}
</style></head><body><header><h1>LYNCO 카드 목록</h1><p id="summary"></p></header><main><div class="toolbar"><input id="search" type="search" aria-label="카드 검색" placeholder="카드 이름 · 효과 · ID"><select id="face" aria-label="면"><option value="all">전체 면</option><option value="front">앞면</option><option value="reverse">뒤집힌 면</option></select><select id="tone" aria-label="색상"><option value="all">전체 색상</option><option value="white">흰색</option><option value="black">검정색</option></select><button onclick="print()">인쇄</button></div><div class="layout"><div class="tablewrap"><table><thead><tr><th>카드</th><th>행동</th><th>점수</th><th>상태</th></tr></thead><tbody id="rows"></tbody></table><div class="empty" id="empty" hidden>검색 결과가 없습니다.</div></div><article class="detail" id="detail"></article></div><footer>영향 방향은 현재 시각 데이터입니다. 설명이나 방향을 편집해도 전투 효과가 자동으로 구현되지는 않습니다. 비용·점수의 ‘미정’은 0과 다릅니다.</footer></main>
<style>.icon.dark{filter:invert(1);background:#ddd}</style>
<script id="data" type="application/json">__LYNCO_DATA__</script><script>
const data=JSON.parse(document.getElementById('data').textContent),cards=data.cards;let selected=cards[0]?.id,origin=[2,2];const offsets={up:[0,-1],up_right:[1,-1],right:[1,0],down_right:[1,1],down:[0,1],down_left:[-1,1],left:[-1,0],up_left:[-1,-1]},names={up:'상',up_right:'우상',right:'우',down_right:'우하',down:'하',down_left:'좌하',left:'좌',up_left:'좌상'};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const num=n=>n<0?'미정':n;
document.getElementById('summary').textContent=`${cards.length}개 항목 · 앞면 ${cards.filter(c=>c.face==='front').length} · 뒤집힌 면 ${cards.filter(c=>c.face==='reverse').length}`;
function render(){const q=document.getElementById('search').value.toLowerCase(),face=document.getElementById('face').value,tone=document.getElementById('tone').value,filtered=cards.filter(c=>(c.name+' '+c.id+' '+c.description).toLowerCase().includes(q)&&(face==='all'||c.face===face)&&(tone==='all'||c.dark===(tone==='black')));if(!filtered.some(c=>c.id===selected))selected=filtered[0]?.id;document.getElementById('empty').hidden=filtered.length>0;document.getElementById('rows').innerHTML=filtered.map(c=>`<tr data-id="${esc(c.id)}" class="${c.id===selected?'selected':''}"><td><button><span class="swatch ${c.dark?'black':'white'}"></span>${esc(c.name)}</button><div class="meta">${esc(c.id)}</div></td><td>${num(c.cost)}</td><td>${num(c.table_cost)}</td><td><span class="status ${c.status==='pending'?'pending':''}">${c.status==='implemented'?'적용 중':'설계 대기'}</span></td></tr>`).join('');document.querySelectorAll('tr[data-id]').forEach(tr=>tr.onclick=()=>{selected=tr.dataset.id;render()});renderDetail()}
function renderDetail(){const c=cards.find(c=>c.id===selected),target=document.getElementById('detail');if(!c){target.innerHTML='';return}const cells=new Set(c.directions.map(d=>offsets[d]).filter(Boolean).map(([x,y])=>[origin[0]+x,origin[1]+y]).filter(([x,y])=>x>=0&&x<6&&y>=0&&y<5).map(([x,y])=>y*6+x));target.innerHTML=`<img class="icon ${c.dark?'dark':''}" alt="${esc(c.name)} 심볼" src="${data.icons[c.icon]||''}"><h2>${esc(c.name)}</h2><div class="meta">${esc(c.kind)} · ${c.face==='front'?'앞면':'뒤집힌 면'} · ${c.dark?'검정':'흰색'}</div><div class="description">${esc(c.description)}</div><dl><dt>행동 비용</dt><dd>${num(c.cost)}</dd><dt>테이블 점수</dt><dd>${num(c.table_cost)}</dd><dt>효과 ID</dt><dd>${esc(c.effect_id)} · ${c.value}</dd><dt>방향</dt><dd>${c.directions.map(d=>names[d]).join(' · ')||'없음'}</dd></dl><div class="legend">영향 범위 · 6열 × 5행</div><div class="grid">${Array.from({length:30},(_,i)=>`<button aria-label="${i%6+1}열 ${Math.floor(i/6)+1}행" class="cell ${i===origin[1]*6+origin[0]?'source':cells.has(i)?'target':''}" data-cell="${i}">${i===origin[1]*6+origin[0]?'●':cells.has(i)?'○':''}</button>`).join('')}</div>${c.legacy_description?`<details><summary>이전 체력 전투 설명 · 현재 효과와 구분</summary><p style="white-space:pre-wrap">${esc(c.legacy_description)}</p></details>`:''}`;target.querySelectorAll('[data-cell]').forEach(b=>b.onclick=()=>{let i=+b.dataset.cell;origin=[i%6,Math.floor(i/6)];renderDetail()})}
['search','face','tone'].forEach(id=>document.getElementById(id).addEventListener('input',render));render();
</script></body></html>
